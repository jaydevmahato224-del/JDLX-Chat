# Railway deploy config for the standalone JDLX Chat backend.
# Without this, Railway sees package.json in the repo root and builds the
# React/Vite frontend as a Node app, so the Flask chat API never starts.
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile.chat"

[deploy]
# 60s, not 300s: a DB stall that blocks every gunicorn thread makes /api/health
# stop answering, and the platform only restarts the container once this
# timeout expires. Waiting 5 minutes left the whole chat dead for 5 minutes.
healthcheckPath = "/api/health"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
