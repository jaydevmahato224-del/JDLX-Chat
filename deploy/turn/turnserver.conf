# coturn settings shared by every deployment. No secrets live here: the shared
# secret and the public IP are passed on the command line by docker-compose.
listening-port=3478
tls-listening-port=5349

# Time-limited credentials (TURN REST API). The backend mints
# "<expiry>:<user id>" + base64(HMAC-SHA1(secret, username)) per call, so no
# long-lived password is ever shipped to a client.
fingerprint
lt-cred-mech
use-auth-secret
stale-nonce=600

# Media relay range. Voice/video needs only a handful of ports; open exactly
# this UDP range in the firewall and keep it in sync with TURN_URLS.
min-port=49160
max-port=49200

# Abuse limits: cap allocations so one client cannot exhaust the relay.
total-quota=200
user-quota=12

no-cli
no-multicast-peers
no-loopback-peers

# Never let the relay be used to reach private or internal networks (an open
# TURN server is otherwise an SSRF pivot into the VPC).
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.0.2.0-192.0.2.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=198.51.100.0-198.51.100.255
denied-peer-ip=203.0.113.0-203.0.113.255
denied-peer-ip=240.0.0.0-255.255.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff
